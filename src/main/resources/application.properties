spring.application.name=gana

# Secrets are never committed. Provide them as environment variables, or put
# them in a git-ignored ./secrets.properties file in the project root
# (see secrets.properties.example).
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gana_music}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

app.music.storage.path=${MUSIC_STORAGE_PATH:${user.home}/Desktop/gana_songs/}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jamendo.client-id=${JAMENDO_CLIENT_ID}
jamendo.base-url=https://api.jamendo.com/v3.0

# JWT - secret must be at least 32 random bytes (base64-encoded recommended)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=gana-app

# Brute-force protection for /api/auth/login
app.security.login.max-attempts=5
app.security.login.lockout-minutes=15
