# Replaces the main application.properties during tests, so they run on an
# in-memory database and never read ./secrets.properties or touch a real one.
spring.application.name=gana

spring.datasource.url=jdbc:h2:mem:gana;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.music.storage.path=${java.io.tmpdir}/gana-test-songs/
app.cors.allowed-origins=http://localhost:5173

jamendo.client-id=test-client-id
jamendo.base-url=http://localhost:1/unused

app.jwt.secret=test-only-secret-test-only-secret-test-only-secret
app.jwt.expiration-ms=3600000
app.jwt.issuer=gana-app

app.security.login.max-attempts=3
app.security.login.lockout-minutes=15
app.security.auth-rate-limit.max-requests=10
app.security.auth-rate-limit.window-seconds=60
